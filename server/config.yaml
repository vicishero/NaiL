# Minimal bootstrap config for first startup.
# Most product and operational settings are now managed in the admin UI:
#   /#/admin/settings
#
# Loading behavior:
# - Built-in defaults are embedded in the binary
# - This file only overrides the bootstrap-critical parts
# - Ports / DB / Redis / feature selection stay file-based

App:
  RunMode: debug

Features:
  Default: ["Web", "Admin", "Meili", "LocalOSS", "MySQL", "Redis", "BigCacheIndex", "LoggerFile"]

WebServer:
  HttpIp: 0.0.0.0
  HttpPort: 8008

Database:
  LogLevel: error
  TablePrefix: p_

MySQL:
  Username: root
  Password: "666888"
  Host: 127.0.0.1:3306
  DBName: paopao
  Charset: utf8mb4
  ParseTime: true
  MaxIdleConns: 10
  MaxOpenConns: 30

Redis:
  InitAddress:
    - 127.0.0.1:6379

JWT:
  Secret: 18a6413dc4fe394c66345ebe501b2f26
  Issuer: paopao-api
  Expire: 86400

# 日志文件配置（需在 Features.Default 中启用 LoggerFile）
LoggerFile:
  SavePath: logs
  FileName: nail
  FileExt: .log

AdminSettings:
  EncryptionKey: "CHANGE-ME-TO-A-LONG-RANDOM-SECRET"

# 雪花算法ID生成配置
Snowflake:
  # 机器ID(0-1023)，分布式部署时每个节点需唯一，未配置则自动取hostname hash
  WorkerID: 1

# 限流配置
RateLimit:
  # 是否启用限流：true/false
  Enable: true
  # 默认限流阈值：每个时间窗口允许的请求数
  DefaultLimit: 100
  # 默认时间窗口：单位秒
  DefaultDur: 60
  # 自定义限流规则（可配置多条）
  Rules:
    # 示例：登录接口限流：IP维度，5分钟10次（防止暴力破解）
    - Key: "/v1/account/login"
      Limit: 10
      Duration: 300
      Dimension: "ip"

    # 示例：短信发送接口限流：IP维度，1分钟5次（防止短信轰炸）
    - Key: "/v1/account/send_sms"
      Limit: 5
      Duration: 60
      Dimension: "ip"

    # 示例：发帖接口限流：用户维度，1分钟5次（防止垃圾内容）
    - Key: "/v1/post/create"
      Limit: 5
      Duration: 60
      Dimension: "user"

    # 示例：评论接口限流：用户维度，1分钟20次
    - Key: "/v1/post/comment"
      Limit: 20
      Duration: 60
      Dimension: "user"

    # 示例：所有v1接口限流：IP+路径维度，1分钟60次（全局基础保护）
    - Key: "/v1/*"
      Limit: 60
      Duration: 60
      Dimension: "ip+path"

# Optional first-boot overrides for the providers enabled in Features.Default.
# If the embedded defaults already match your environment, you can remove these
# and manage later adjustments from /#/admin/settings.
Meili:
  Host: 127.0.0.1:7700
  Index: paopao-data
  ApiKey: paopao-meilisearch
  Secure: false

LocalOSS:
  SavePath: custom/data/paopao-ce/oss
  Secure: false
  Bucket: paopao
  Domain: 192.168.30.44:8008

Dify:
  URL: "https://api.dify.ai"
  APIKey: "app-hwL3g2syuknNoj4SjBnsEhbz"
